{% extends "base.html" %}

{% block title %}Company Sign Up - AI Interview Platform{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0"><i class="fas fa-building"></i> Company Registration</h3>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="name" class="form-label">Company Name *</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="email" class="form-label">Email Address *</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                            <div class="form-text" id="emailFeedback"></div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="password" class="form-label">Password *</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="confirm_password" class="form-label">Confirm Password *</label>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="company_size" class="form-label">Company Size *</label>
                            <select class="form-select" id="company_size" name="company_size" required>
                                <option value="">Select company size</option>
                                <option value="1-10">1-10 employees</option>
                                <option value="11-50">11-50 employees</option>
                                <option value="51-200">51-200 employees</option>
                                <option value="201-500">201-500 employees</option>
                                <option value="500+">500+ employees</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="industry" class="form-label">Industry *</label>
                            <select class="form-select" id="industry" name="industry" required>
                                <option value="">Select industry</option>
                                <option value="technology">Technology</option>
                                <option value="finance">Finance</option>
                                <option value="healthcare">Healthcare</option>
                                <option value="education">Education</option>
                                <option value="retail">Retail</option>
                                <option value="manufacturing">Manufacturing</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="description" class="form-label">Company Description</label>
                        <textarea class="form-control" id="description" name="description" rows="4" 
                                  placeholder="Tell us about your company..."></textarea>
                    </div>
                    
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">Register Company</button>
                    </div>
                </form>
                
                <div class="text-center mt-3">
                    <p>Already have an account? <a href="{{ url_for('company_login') }}">Login here</a></p>
                    <p><a href="{{ url_for('index') }}">Back to Home</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('confirm_password').addEventListener('input', function() {
    const password = document.getElementById('password').value;
    const confirmPassword = this.value;
    
    if (password !== confirmPassword) {
        this.setCustomValidity('Passwords do not match');
    } else {
        this.setCustomValidity('');
    }
});

// Email validation
document.getElementById('email').addEventListener('blur', function() {
    const email = this.value;
    const feedback = document.getElementById('emailFeedback');
    
    if (email && email.includes('@')) {
        // Check email availability
        fetch(`/check-email?email=${encodeURIComponent(email)}&type=company`)
            .then(response => response.json())
            .then(data => {
                if (data.exists) {
                    feedback.innerHTML = `<span class="text-danger"><i class="fas fa-times"></i> ${data.message}</span>`;
                    this.setCustomValidity('Email already exists');
                } else {
                    feedback.innerHTML = `<span class="text-success"><i class="fas fa-check"></i> Email available</span>`;
                    this.setCustomValidity('');
                }
            })
            .catch(error => {
                console.error('Error checking email:', error);
            });
    } else {
        feedback.innerHTML = '';
    }
});
</script>
{% endblock %}
